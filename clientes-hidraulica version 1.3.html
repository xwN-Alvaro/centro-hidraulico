<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clientes · Mecánica Hidráulica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --line: #334155;
  --accent: #f59e0b;
  --accent-hover: #d97706;
  --accent-ink: #0f172a;
  --head-bg: #090d16;
  --ok: #10b981;
  --ok-bg: rgba(16, 185, 129, 0.1);
  --err: #ef4444;
  --err-bg: rgba(239, 68, 68, 0.1);
  --row-alt: #162032;
  --semana-bg: #0f2744;
  --semana-border: #1d4ed8;
  --card-bg: #1e293b;
  --radius: 10px;
  box-sizing: border-box;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f1f5f9;
    --panel: #ffffff;
    --panel-hover: #f8fafc;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #d97706;
    --accent-hover: #b45309;
    --accent-ink: #ffffff;
    --head-bg: #0f172a;
    --ok: #059669;
    --err: #dc2626;
    --row-alt: #f8fafc;
    --semana-bg: #eff6ff;
    --semana-border: #93c5fd;
    --card-bg: #ffffff;
    color-scheme: light;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}

header {
  background: var(--head-bg);
  color: #fff;
  padding: 24px 32px;
  border-bottom: 4px solid var(--accent);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.header-container {
  max-width: 1280px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.header-title h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 10px;
}

.header-title p {
  color: #94a3b8;
  font-size: 14px;
  margin-top: 4px;
}

/* Tarjetas métricas superiores */
.kpi-grid {
  display: flex;
  gap: 16px;
}

.kpi-card {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 10px 18px;
  border-radius: 8px;
  min-width: 130px;
}

.kpi-card .val {
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}

.kpi-card .lbl {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: #94a3b8;
}

main {
  display: grid;
  grid-template-columns: 360px 1fr;
  gap: 24px;
  max-width: 1280px;
  margin: 28px auto 0;
  padding: 0 24px;
  align-items: start;
}

section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

h2 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 18px;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 8px;
}

label {
  display: block;
  margin-bottom: 14px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

input {
  width: 100%;
  margin-top: 6px;
  padding: 11px 14px;
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  transition: all 0.2s ease;
}

input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
}

button {
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  border-radius: 6px;
  padding: 10px 16px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

button:hover { background: var(--panel-hover); }

button.primary {
  width: 100%;
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-size: 16px;
  font-weight: 700;
  margin-top: 10px;
  padding: 12px;
  box-shadow: 0 2px 10px rgba(245, 158, 11, 0.25);
}

button.primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  transform: translateY(-1px);
}

button.secondary {
  font-size: 13px;
  padding: 8px 12px;
  background: var(--bg);
}

button.danger {
  padding: 5px 10px;
  font-size: 13px;
  color: var(--err);
  border-color: rgba(239, 68, 68, 0.3);
}

button.danger:hover { background: var(--err-bg); }

button.danger.confirm {
  background: var(--err);
  border-color: var(--err);
  color: #fff;
}

button.btn-edit {
  padding: 3px 6px;
  font-size: 12px;
  margin-left: 6px;
  border: none;
  background: transparent;
  color: var(--muted);
  border-radius: 4px;
}

button.btn-edit:hover {
  background: var(--line);
  color: var(--ink);
}

button.btn-wsp {
  padding: 3px 6px;
  font-size: 12px;
  border: none;
  background: rgba(16, 185, 129, 0.15);
  color: var(--ok);
  border-radius: 4px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
}

button.btn-wsp:hover { background: var(--ok); color: #fff; }

.buscar input {
  font-size: 16px;
  padding: 12px 16px;
  margin-top: 0;
  background: var(--panel);
}

.resumen {
  margin: 14px 0 16px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tabla {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 680px;
  font-size: 14px;
}

th {
  text-align: left;
  font-weight: 700;
  color: var(--muted);
  background: var(--bg);
  border-bottom: 2px solid var(--line);
  padding: 12px 14px;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

tbody tr { transition: background 0.15s ease; }
tbody tr:hover { background: var(--panel-hover); }
tbody tr:nth-child(even) { background: var(--row-alt); }

th.num, td.num {
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

tr.semana-header {
  background: var(--semana-bg) !important;
  font-weight: 700;
  border-left: 4px solid var(--semana-border);
}

tr.semana-header td {
  padding: 10px 14px;
  color: var(--ink);
  font-size: 13px;
}

.vacio {
  text-align: center;
  color: var(--muted);
  padding: 36px 14px;
  font-size: 15px;
}

#mensaje {
  min-height: 1.5em;
  margin-top: 14px;
  font-weight: 600;
  font-size: 14px;
  padding: 8px 12px;
  border-radius: 6px;
  display: none;
}

#mensaje.ok {
  display: block;
  color: var(--ok);
  background: var(--ok-bg);
  border: 1px solid rgba(16, 185, 129, 0.2);
}

#mensaje.error {
  display: block;
  color: var(--err);
  background: var(--err-bg);
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.editable-cell {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.sin-tel {
  color: var(--muted);
  font-style: italic;
  font-size: 13px;
}

.acciones-respaldo {
  margin-top: 28px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.acciones-respaldo h3 {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.btn-grupo {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}

@media (max-width: 960px) {
  main { grid-template-columns: 1fr; }
  .kpi-grid { width: 100%; justify-content: space-between; }
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="header-title">
      <h1>⚙️ Mecánica Hidráulica</h1>
      <p>Gestión y registro de clientes y trabajos</p>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="val" id="kpi-total">0</div>
        <div class="lbl">Clientes</div>
      </div>
      <div class="kpi-card">
        <div class="val" id="kpi-ingresos">$0</div>
        <div class="lbl">Ingresos Totales</div>
      </div>
    </div>
  </div>
</header>

<main>
  <section>
    <h2>🛠️ Registrar Cliente</h2>
    <div>
      <label>Nombre del Cliente
        <input id="nombre" type="text" placeholder="Ej: Juan Pérez" autocomplete="off">
      </label>
      <label>Teléfono (opcional)
        <input id="telefono" type="text" placeholder="Ej: +56 9 1234 5678" autocomplete="off">
      </label>
      <label>Tipo de Trabajo
        <input id="trabajo" type="text" placeholder="Ej: Reparación de cilindro..." autocomplete="off">
      </label>
      <label>Precio ($ CLP)
        <input id="precio" type="number" min="1" step="1" placeholder="Ej: 85000">
      </label>
      <button class="primary" type="button" onclick="registrarCliente()">+ Registrar Trabajo</button>
    </div>
    <div id="mensaje" role="status" aria-live="polite"></div>

    <div class="acciones-respaldo">
      <h3>💾 Copia de Seguridad</h3>
      <div class="btn-grupo">
        <button class="secondary" type="button" onclick="exportarExcel()">📊 Exportar a Excel (CSV)</button>
        <button class="secondary" type="button" onclick="exportarJSON()">📥 Descargar Respaldo</button>
        <button class="secondary" type="button" onclick="$('input-archivo').click()">📂 Restaurar Copia</button>
      </div>
      <input id="input-archivo" type="file" accept=".json" style="display:none;" onchange="importarJSON(event)">
    </div>
  </section>

  <section>
    <h2>📋 Lista de Trabajos</h2>
    <label class="buscar">
      <input id="buscar" type="text" placeholder="🔍 Buscar cliente por nombre..." autocomplete="off" oninput="dibujar()">
    </label>
    <div class="resumen" id="resumen"></div>
    <div class="tabla">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Trabajo</th>
            <th class="num">Precio</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const CLAVE = "clientes-hidraulica";
let clientes = [];
let confirmando = null;

const $ = id => document.getElementById(id);
const normalizar = s => s ? String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim() : "";
const pesos = n => "$" + Number(n || 0).toLocaleString("es-CL");

function obtenerFechaHoyISO() {
  const d = new Date();
  const a = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${a}-${m}-${dia}`;
}

function cargar() {
  try {
    const guardado = localStorage.getItem(CLAVE);
    const datos = guardado ? JSON.parse(guardado) : [];
    clientes = Array.isArray(datos) ? datos : [];
  } catch (e) {
    clientes = [];
  }
}

function guardar() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify(clientes));
    actualizarKPIs();
    return true;
  } catch (e) {
    return false;
  }
}

function actualizarKPIs() {
  const totalClientes = clientes.length;
  const totalIngresos = clientes.reduce((sum, c) => sum + Number(c.precio || 0), 0);
  
  $("kpi-total").textContent = totalClientes;
  $("kpi-ingresos").textContent = pesos(totalIngresos);
}

function mensaje(texto, tipo) {
  const m = $("mensaje");
  if (m) {
    m.textContent = texto;
    m.className = tipo;
  }
}

function celda(fila, texto, clase) {
  const td = document.createElement("td");
  td.textContent = texto;
  if (clase) td.className = clase;
  fila.appendChild(td);
}

function obtenerRangoSemana(fechaStr) {
  const partes = (fechaStr || "").split('-').map(Number);
  let d;
  if (partes.length === 3 && !partes.some(isNaN)) {
    d = new Date(partes[0], partes[1] - 1, partes[2]);
  } else {
    d = new Date();
  }
  
  const diaSemana = d.getDay();
  const diffLunes = d.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
  
  const lunes = new Date(d);
  lunes.setDate(diffLunes);
  const domingo = new Date(lunes);
  domingo.setDate(lunes.getDate() + 6);

  const formato = date => date.toLocaleDateString("es-CL", { day: '2-digit', month: 'short' });
  
  const a = lunes.getFullYear();
  const m = String(lunes.getMonth() + 1).padStart(2, '0');
  const dia = String(lunes.getDate()).padStart(2, '0');
  
  return {
    key: `${a}-${m}-${dia}`,
    etiqueta: `Semana del ${formato(lunes)} al ${formato(domingo)}`
  };
}

function formatearFechaVista(fechaStr) {
  if (!fechaStr) return "-";
  const partes = fechaStr.split('-').map(Number);
  if (partes.length !== 3 || partes.some(isNaN)) return "-";
  const d = new Date(partes[0], partes[1] - 1, partes[2]);
  return d.toLocaleDateString("es-CL", { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function editarTelefono(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  const nuevoTelefono = prompt("Editar teléfono de " + cliente.nombre + ":", cliente.telefono === "Sin teléfono" ? "" : cliente.telefono);
  if (nuevoTelefono === null) return;
  
  cliente.telefono = nuevoTelefono.trim() || "Sin teléfono";
  guardar();
  dibujar();
  mensaje("Teléfono actualizado.", "ok");
}

function editarTrabajo(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  const nuevoTrabajo = prompt("Editar trabajo de " + cliente.nombre + ":", cliente.trabajo);
  if (nuevoTrabajo === null) return;
  
  const trabajoLimpio = nuevoTrabajo.trim();
  if (!trabajoLimpio) return mensaje("El tipo de trabajo no puede estar vacío.", "error");
  
  cliente.trabajo = trabajoLimpio;
  guardar();
  dibujar();
  mensaje("Tipo de trabajo actualizado.", "ok");
}

function editarPrecio(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  const nuevoPrecioStr = prompt("Editar precio de " + cliente.nombre + ":", cliente.precio);
  if (nuevoPrecioStr === null) return;
  
  const nuevoPrecio = Number(nuevoPrecioStr);
  if (isNaN(nuevoPrecio) || nuevoPrecio <= 0) return mensaje("Precio inválido.", "error");
  
  cliente.precio = nuevoPrecio;
  guardar();
  dibujar();
  mensaje("Precio actualizado.", "ok");
}

function dibujar() {
  const inputBuscar = $("buscar");
  const consulta = inputBuscar ? normalizar(inputBuscar.value) : "";
  const visibles = clientes.filter(c => normalizar(c.nombre).includes(consulta));
  
  visibles.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));

  const cuerpo = $("filas");
  if (!cuerpo) return;
  cuerpo.textContent = "";

  if (visibles.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 6;
    td.className = "vacio";
    td.textContent = clientes.length === 0
      ? "Aún no hay clientes registrados."
      : "Sin coincidencias para “" + (inputBuscar ? inputBuscar.value.trim() : "") + "”.";
    tr.appendChild(td);
    cuerpo.appendChild(tr);
  } else {
    const semanas = {};
    visibles.forEach(c => {
      const fechaBase = c.fecha || obtenerFechaHoyISO();
      const { key, etiqueta } = obtenerRangoSemana(fechaBase);
      if (!semanas[key]) {
        semanas[key] = { etiqueta, clientes: [], total: 0 };
      }
      semanas[key].clientes.push(c);
      semanas[key].total += Number(c.precio || 0);
    });

    Object.keys(semanas).sort().reverse().forEach(key => {
      const grupo = semanas[key];

      const trSemana = document.createElement("tr");
      trSemana.className = "semana-header";
      
      const tdEtiqueta = document.createElement("td");
      tdEtiqueta.colSpan = 4;
      tdEtiqueta.textContent = "📅 " + grupo.etiqueta;
      trSemana.appendChild(tdEtiqueta);

      const tdTotal = document.createElement("td");
      tdTotal.className = "num";
      tdTotal.textContent = "Subtotal: " + pesos(grupo.total);
      trSemana.appendChild(tdTotal);

      trSemana.appendChild(document.createElement("td"));
      cuerpo.appendChild(trSemana);

      grupo.clientes.forEach(c => {
        const tr = document.createElement("tr");
        celda(tr, formatearFechaVista(c.fecha));
        celda(tr, c.nombre);
        
        // Celda Teléfono + WhatsApp
        const tdTel = document.createElement("td");
        const contTel = document.createElement("div");
        contTel.className = "editable-cell";
        
        const spanTel = document.createElement("span");
        spanTel.textContent = c.telefono || "Sin teléfono";
        if (!c.telefono || c.telefono === "Sin teléfono") spanTel.className = "sin-tel";
        contTel.appendChild(spanTel);

        if (c.telefono && c.telefono !== "Sin teléfono") {
          const numLimpio = c.telefono.replace(/\D/g, "");
          if (numLimpio.length >= 8) {
            const btnWsp = document.createElement("a");
            btnWsp.className = "btn-wsp";
            btnWsp.href = `https://wa.me/${numLimpio}`;
            btnWsp.target = "_blank";
            btnWsp.title = "Enviar WhatsApp";
            btnWsp.textContent = "💬";
            contTel.appendChild(btnWsp);
          }
        }
        
        const btnEditTel = document.createElement("button");
        btnEditTel.className = "btn-edit";
        btnEditTel.type = "button";
        btnEditTel.title = "Editar teléfono";
        btnEditTel.textContent = "✏️";
        btnEditTel.onclick = () => editarTelefono(c.id);
        
        contTel.appendChild(btnEditTel);
        tdTel.appendChild(contTel);
        tr.appendChild(tdTel);

        // Celda Trabajo
        const tdTrabajo = document.createElement("td");
        const contTrabajo = document.createElement("div");
        contTrabajo.className = "editable-cell";
        const spanTrabajo = document.createElement("span");
        spanTrabajo.textContent = c.trabajo;
        
        const btnEditTrabajo = document.createElement("button");
        btnEditTrabajo.className = "btn-edit";
        btnEditTrabajo.type = "button";
        btnEditTrabajo.title = "Editar trabajo";
        btnEditTrabajo.textContent = "✏️";
        btnEditTrabajo.onclick = () => editarTrabajo(c.id);
        
        contTrabajo.appendChild(spanTrabajo);
        contTrabajo.appendChild(btnEditTrabajo);
        tdTrabajo.appendChild(contTrabajo);
        tr.appendChild(tdTrabajo);
        
        // Celda Precio
        const tdPrecio = document.createElement("td");
        tdPrecio.className = "num";
        const contPrecio = document.createElement("div");
        contPrecio.className = "editable-cell";
        contPrecio.style.justifyContent = "flex-end";
        
        const spanPrecio = document.createElement("span");
        spanPrecio.textContent = pesos(c.precio);
        
        const btnEditPrecio = document.createElement("button");
        btnEditPrecio.className = "btn-edit";
        btnEditPrecio.type = "button";
        btnEditPrecio.title = "Editar precio";
        btnEditPrecio.textContent = "✏️";
        btnEditPrecio.onclick = () => editarPrecio(c.id);
        
        contPrecio.appendChild(spanPrecio);
        contPrecio.appendChild(btnEditPrecio);
        tdPrecio.appendChild(contPrecio);
        tr.appendChild(tdPrecio);
        
        // Celda Eliminar
        const tdAcciones = document.createElement("td");
        tdAcciones.className = "num";
        const b = document.createElement("button");
        b.type = "button";
        b.className = "danger" + (confirmando === c.id ? " confirm" : "");
        b.textContent = confirmando === c.id ? "¿Seguro?" : "Eliminar";
        b.onclick = () => eliminar(c.id);
        tdAcciones.appendChild(b);
        tr.appendChild(tdAcciones);
        
        cuerpo.appendChild(tr);
      });
    });
  }

  const total = visibles.reduce((suma, c) => suma + Number(c.precio || 0), 0);
  const resumen = $("resumen");
  if (resumen) {
    resumen.textContent = (consulta ? visibles.length + " de " + clientes.length : clientes.length)
      + (clientes.length === 1 ? " cliente" : " clientes") + " · Total mostrado " + pesos(total);
  }
}

function registrarCliente() {
  const elNombre = $("nombre");
  const elTelefono = $("telefono");
  const elTrabajo = $("trabajo");
  const elPrecio = $("precio");

  const nombre = elNombre ? elNombre.value.trim() : "";
  const telefonoIngresado = elTelefono ? elTelefono.value.trim() : "";
  const telefono = telefonoIngresado || "Sin teléfono";
  const trabajo = elTrabajo ? elTrabajo.value.trim() : "";
  const precio = elPrecio ? Number(elPrecio.value) : 0;
  const fecha = obtenerFechaHoyISO();

  if (!nombre) return mensaje("Nombre: no puede estar vacío.", "error");
  if (!trabajo) return mensaje("Tipo de trabajo: no puede estar vacío.", "error");
  if (!precio || precio <= 0) return mensaje("Precio: ingresa un monto válido mayor a 0.", "error");

  const nuevoCliente = { 
    id: Date.now() + Math.random(), 
    fecha, 
    nombre, 
    telefono, 
    trabajo, 
    precio 
  };

  clientes.unshift(nuevoCliente);
  guardar();

  if (elNombre) elNombre.value = "";
  if (elTelefono) elTelefono.value = "";
  if (elTrabajo) elTrabajo.value = "";
  if (elPrecio) elPrecio.value = "";

  dibujar();
  if (elNombre) elNombre.focus();
  mensaje(nombre + " registrado correctamente.", "ok");
}

function eliminar(id) {
  if (confirmando !== id) {
    confirmando = id;
    dibujar();
    setTimeout(() => { if (confirmando === id) { confirmando = null; dibujar(); } }, 4000);
    return;
  }
  const cliente = clientes.find(c => c.id === id);
  clientes = clientes.filter(c => c.id !== id);
  confirmando = null;
  guardar();
  dibujar();
  mensaje((cliente ? cliente.nombre : "Cliente") + " eliminado.", "ok");
}

function descargarArchivo(contenido, nombreArchivo, tipoMime) {
  const blob = new Blob([contenido], { type: tipoMime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportarExcel() {
  if (clientes.length === 0) return mensaje("No hay clientes registrados.", "error");
  let csv = "\uFEFFFecha;Nombre;Teléfono;Tipo de Trabajo;Precio ($)\n";
  clientes.forEach(c => {
    const f = formatearFechaVista(c.fecha);
    const n = `"${(c.nombre || "").replace(/"/g, '""')}"`;
    const t = `"${(c.telefono || "").replace(/"/g, '""')}"`;
    const tr = `"${(c.trabajo || "").replace(/"/g, '""')}"`;
    const p = c.precio || 0;
    csv += `${f};${n};${t};${tr};${p}\n`;
  });
  descargarArchivo(csv, `clientes_hidraulica_${obtenerFechaHoyISO()}.csv`, "text/csv;charset=utf-8;");
  mensaje("Lista exportada a Excel (CSV).", "ok");
}

function exportarJSON() {
  if (clientes.length === 0) return mensaje("No hay registros para respaldar.", "error");
  const contenido = JSON.stringify(clientes, null, 2);
  descargarArchivo(contenido, `respaldo_clientes_${obtenerFechaHoyISO()}.json`, "application/json");
  mensaje("Respaldo guardado correctamente.", "ok");
}

function importarJSON(evento) {
  const archivo = evento.target.files[0];
  if (!archivo) return;
  const lector = new FileReader();
  lector.onload = function(e) {
    try {
      const datos = JSON.parse(e.target.result);
      if (Array.isArray(datos)) {
        if (confirm(`¿Cargar ${datos.length} clientes registrados?`)) {
          clientes = datos;
          guardar();
          dibujar();
          mensaje(`Cargados ${datos.length} clientes.`, "ok");
        }
      } else {
        mensaje("Archivo no válido.", "error");
      }
    } catch (err) {
      mensaje("Error al leer el archivo.", "error");
    }
    evento.target.value = "";
  };
  lector.readAsText(archivo);
}

cargar();
actualizarKPIs();
dibujar();
