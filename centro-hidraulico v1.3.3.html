 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro Hidráulico · Control de Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f172a;
  --panel: #1e293b;
  --panel-hover: #334155;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --line: #334155;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --accent-ink: #ffffff;
  --head-bg: #090d16;
  --ok: #10b981;
  --ok-bg: rgba(16, 185, 129, 0.1);
  --err: #ef4444;
  --err-bg: rgba(239, 68, 68, 0.1);
  --row-alt: #162032;
  --semana-bg: #1e293b;
  --semana-border: #3b82f6;
  --radius: 6px;
  box-sizing: border-box;
  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-hover: #f1f5f9;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-ink: #ffffff;
    --head-bg: #0f172a;
    --ok: #059669;
    --err: #dc2626;
    --row-alt: #f8fafc;
    --semana-bg: #f1f5f9;
    --semana-border: #2563eb;
    color-scheme: light;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  padding-bottom: 40px;
}

header {
  background: var(--head-bg);
  color: #fff;
  padding: 20px 32px;
  border-bottom: 1px solid var(--line);
}

.header-container {
  max-width: 1440px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-title h1 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: #fff;
}

.header-title p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 2px;
}

.header-version {
  font-size: 12px;
  color: var(--muted);
  border: 1px solid var(--line);
  padding: 4px 8px;
  border-radius: 4px;
}

main {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 24px;
  max-width: 1440px;
  margin: 24px auto 0;
  padding: 0 24px;
  align-items: start;
}

section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}

h2 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

label {
  display: block;
  margin-bottom: 12px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

input, select {
  width: 100%;
  margin-top: 5px;
  padding: 9px 12px;
  font-family: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  transition: border-color 0.15s ease;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--accent);
}

button {
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  border-radius: 4px;
  padding: 8px 14px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--ink);
  transition: all 0.15s ease;
  font-size: 13px;
}

button:hover { background: var(--panel-hover); }

button.primary {
  width: 100%;
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-size: 14px;
  font-weight: 600;
  margin-top: 8px;
  padding: 10px;
}

button.primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

button.secondary {
  font-size: 12px;
  padding: 6px 10px;
  background: var(--bg);
  text-align: left;
}

button.danger {
  padding: 4px 8px;
  font-size: 12px;
  color: var(--err);
  border-color: rgba(239, 68, 68, 0.3);
}

button.danger:hover { background: var(--err-bg); }

button.danger.confirm {
  background: var(--err);
  border-color: var(--err);
  color: #fff;
}

button.btn-edit {
  padding: 2px 5px;
  font-size: 11px;
  margin-left: 4px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--muted);
  border-radius: 3px;
}

button.btn-edit:hover {
  border-color: var(--muted);
  color: var(--ink);
}

a.btn-wsp {
  padding: 2px 6px;
  font-size: 11px;
  border: 1px solid rgba(16, 185, 129, 0.3);
  background: var(--ok-bg);
  color: var(--ok);
  border-radius: 3px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  margin-left: 4px;
}

a.btn-wsp:hover { background: var(--ok); color: #fff; }

.buscar input {
  font-size: 14px;
  padding: 10px 12px;
  margin-top: 0;
  background: var(--bg);
}

.resumen {
  margin: 12px 0 14px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 500;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tabla {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 4px;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
  font-size: 13px;
}

th {
  text-align: left;
  font-weight: 600;
  color: var(--muted);
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 10px 12px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

tbody tr:hover { background: var(--panel-hover); }
tbody tr:nth-child(even) { background: var(--row-alt); }

th.num, td.num {
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

tr.semana-header {
  background: var(--semana-bg) !important;
  font-weight: 600;
  border-left: 3px solid var(--semana-border);
}

tr.semana-header td {
  padding: 8px 12px;
  color: var(--ink);
  font-size: 12px;
}

.vacio {
  text-align: center;
  color: var(--muted);
  padding: 30px 12px;
  font-size: 14px;
}

.espera {
  color: #f59e0b;
  font-style: italic;
  font-size: 12px;
}

#mensaje {
  min-height: 1.5em;
  margin-top: 12px;
  font-weight: 500;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 4px;
  display: none;
}

#mensaje.ok {
  display: block;
  color: var(--ok);
  background: var(--ok-bg);
  border: 1px solid rgba(16, 185, 129, 0.2);
}

#mensaje.error {
  display: block;
  color: var(--err);
  background: var(--err-bg);
  border: 1px solid rgba(239, 68, 68, 0.2);
}

.editable-cell {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.sin-tel {
  color: var(--muted);
  font-style: italic;
  font-size: 12px;
}

.acciones-respaldo {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.acciones-respaldo h3 {
  margin: 0 0 10px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.btn-grupo {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="header-title">
      <h1>Centro Hidráulico</h1>
      <p>Registro y control de trabajos</p>
    </div>
    <div class="header-version">v1.3.3</div>
  </div>
</header>

<main>
  <section>
    <h2>Nuevo Cliente</h2>
    <div>
      <label>Nombre del Cliente
        <input id="nombre" type="text" placeholder="Nombre completo" autocomplete="off">
      </label>
      <label>Teléfono (opcional)
        <input id="telefono" type="text" placeholder="+56 9 1234 5678" autocomplete="off">
      </label>
      <label>Tipo de Trabajo
        <input id="trabajo" type="text" placeholder="Descripción del trabajo..." autocomplete="off">
      </label>
      <label>Método de Pago
        <select id="pago">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia">Transferencia</option>
          <option value="Tarjeta">Tarjeta</option>
        </select>
      </label>
      <label>Factura
        <select id="factura">
          <option value="Sin Factura">Sin Factura</option>
          <option value="Con Factura">Con Factura</option>
        </select>
      </label>
      <label>Cálculo de IVA
        <select id="iva">
          <option value="sin">Sin IVA</option>
          <option value="con">Con IVA (19%)</option>
        </select>
      </label>
      <label>Precio Base ($ CLP, 0 = En espera)
        <input id="precio" type="number" min="0" step="1" placeholder="Monto base">
      </label>
      <button class="primary" type="button" onclick="registrarCliente()">Registrar Trabajo</button>
    </div>
    <div id="mensaje" role="status" aria-live="polite"></div>

    <div class="acciones-respaldo">
      <h3>Respaldos y Datos</h3>
      <div class="btn-grupo">
        <button class="secondary" type="button" onclick="exportarExcel()">Exportar a Excel (CSV)</button>
        <button class="secondary" type="button" onclick="exportarJSON()">Descargar Copia JSON</button>
        <button class="secondary" type="button" onclick="$('input-archivo').click()">Restaurar Copia</button>
      </div>
      <input id="input-archivo" type="file" accept=".json" style="display:none;" onchange="importarJSON(event)">
    </div>
  </section>

  <section>
    <h2>Registros</h2>
    <label class="buscar">
      <input id="buscar" type="text" placeholder="Buscar por nombre de cliente..." autocomplete="off" oninput="dibujar()">
    </label>
    <div class="resumen" id="resumen"></div>
    <div class="tabla">
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Nombre</th>
            <th>Teléfono</th>
            <th>Trabajo</th>
            <th>Pago</th>
            <th>Factura</th>
            <th>IVA</th>
            <th class="num">Precio Total</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const CLAVE = "centro-hidraulico";
let clientes = [];
let confirmando = null;

const $ = id => document.getElementById(id);
const normalizar = s => s ? String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim() : "";
const pesos = n => "$" + Number(n || 0).toLocaleString("es-CL");

function obtenerFechaHoyISO() {
  const d = new Date();
  const a = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dia = String(d.getDate()).padStart(2, '0');
  return `${a}-${m}-${dia}`;
}

function cargar() {
  try {
    const guardado = localStorage.getItem(CLAVE);
    const datos = guardado ? JSON.parse(guardado) : [];
    clientes = Array.isArray(datos) ? datos : [];
  } catch (e) {
    clientes = [];
  }
}

function guardar() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify(clientes));
    return true;
  } catch (e) {
    return false;
  }
}

function mensaje(texto, tipo) {
  const m = $("mensaje");
  if (m) {
    m.textContent = texto;
    m.className = tipo;
  }
}

function celda(fila, texto, clase) {
  const td = document.createElement("td");
  td.textContent = texto;
  if (clase) td.className = clase;
  fila.appendChild(td);
}

function obtenerRangoSemana(fechaStr) {
  const partes = (fechaStr || "").split('-').map(Number);
  let d;
  if (partes.length === 3 && !partes.some(isNaN)) {
    d = new Date(partes[0], partes[1] - 1, partes[2]);
  } else {
    d = new Date();
  }
  
  const diaSemana = d.getDay();
  const diffLunes = d.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
  
  const lunes = new Date(d);
  lunes.setDate(diffLunes);
  const domingo = new Date(lunes);
  domingo.setDate(lunes.getDate() + 6);

  const formato = date => date.toLocaleDateString("es-CL", { day: '2-digit', month: 'short' });
  
  const a = lunes.getFullYear();
  const m = String(lunes.getMonth() + 1).padStart(2, '0');
  const dia = String(lunes.getDate()).padStart(2, '0');
  
  return {
    key: `${a}-${m}-${dia}`,
    etiqueta: `Semana del ${formato(lunes)} al ${formato(domingo)}`
  };
}

function formatearFechaVista(fechaStr) {
  if (!fechaStr) return "-";
  const partes = fechaStr.split('-').map(Number);
  if (partes.length !== 3 || partes.some(isNaN)) return "-";
  const d = new Date(partes[0], partes[1] - 1, partes[2]);
  return d.toLocaleDateString("es-CL", { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function editarTelefono(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  const nuevoTelefono = prompt("Editar teléfono de " + cliente.nombre + ":", cliente.telefono === "Sin teléfono" ? "" : cliente.telefono);
  if (nuevoTelefono === null) return;
  
  cliente.telefono = nuevoTelefono.trim() || "Sin teléfono";
  guardar();
  dibujar();
  mensaje("Teléfono actualizado.", "ok");
}

function editarTrabajo(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  const nuevoTrabajo = prompt("Editar trabajo de " + cliente.nombre + ":", cliente.trabajo);
  if (nuevoTrabajo === null) return;
  
  const trabajoLimpio = nuevoTrabajo.trim();
  if (!trabajoLimpio) return mensaje("El tipo de trabajo no puede estar vacío.", "error");
  
  cliente.trabajo = trabajoLimpio;
  guardar();
  dibujar();
  mensaje("Tipo de trabajo actualizado.", "ok");
}

function editarPago(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  const opciones = ["Efectivo", "Transferencia", "Tarjeta"];
  const nuevoPago = prompt("Editar método de pago (Efectivo, Transferencia, Tarjeta):", cliente.pago || "Efectivo");
  if (nuevoPago === null) return;

  const pagoLimpio = nuevoPago.trim();
  if (!opciones.some(o => o.toLowerCase() === pagoLimpio.toLowerCase())) {
    return mensaje("Método no válido. Usa: Efectivo, Transferencia o Tarjeta.", "error");
  }

  cliente.pago = opciones.find(o => o.toLowerCase() === pagoLimpio.toLowerCase());
  guardar();
  dibujar();
  mensaje("Método de pago actualizado.", "ok");
}

function editarFactura(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  const respuesta = prompt("Selecciona estado de Factura para " + cliente.nombre + ":\n1. Sin Factura\n2. Con Factura", (cliente.factura === "Con Factura") ? "2" : "1");
  if (respuesta === null) return;

  const v = respuesta.trim();
  if (v === "1" || v.toLowerCase() === "sin factura" || v.toLowerCase() === "sin") {
    cliente.factura = "Sin Factura";
  } else if (v === "2" || v.toLowerCase() === "con factura" || v.toLowerCase() === "con") {
    cliente.factura = "Con Factura";
  } else {
    return mensaje("Opción de Factura no válida.", "error");
  }

  guardar();
  dibujar();
  mensaje("Factura actualizada.", "ok");
}

function editarIva(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  if (cliente.precioBase === undefined) {
    cliente.precioBase = cliente.precio || 0;
  }
  
  const respuesta = prompt("Selecciona estado de IVA para " + cliente.nombre + ":\n1. Sin IVA\n2. Con IVA (19%)", cliente.aplicaIva ? "2" : "1");
  if (respuesta === null) return;
  
  const v = respuesta.trim();
  if (v === "1" || v.toLowerCase() === "sin iva" || v.toLowerCase() === "sin") {
    cliente.aplicaIva = false;
  } else if (v === "2" || v.toLowerCase() === "con iva" || v.toLowerCase() === "con") {
    cliente.aplicaIva = true;
  } else {
    return mensaje("Opción de IVA no válida.", "error");
  }

  cliente.precio = (cliente.precioBase === 0) ? 0 : (cliente.aplicaIva ? Math.round(cliente.precioBase * 1.19) : cliente.precioBase);
  guardar();
  dibujar();
  mensaje("IVA actualizado correctamente.", "ok");
}

function editarPrecio(id) {
  const cliente = clientes.find(c => c.id === id);
  if (!cliente) return;
  const actualBase = cliente.precioBase !== undefined ? cliente.precioBase : (cliente.precio || 0);
  
  const nuevoPrecioStr = prompt("Editar precio base de " + cliente.nombre + " (0 para dejar en espera):", actualBase);
  if (nuevoPrecioStr === null) return;
  
  const nuevoPrecioBase = Number(nuevoPrecioStr);
  if (isNaN(nuevoPrecioBase) || nuevoPrecioBase < 0) return mensaje("Precio inválido. Ingresa 0 o un monto mayor.", "error");
  
  cliente.precioBase = nuevoPrecioBase;
  cliente.precio = (nuevoPrecioBase === 0) ? 0 : (cliente.aplicaIva ? Math.round(nuevoPrecioBase * 1.19) : nuevoPrecioBase);
  
  guardar();
  dibujar();
  mensaje("Precio actualizado.", "ok");
}

function dibujar() {
  const inputBuscar = $("buscar");
  const consulta = inputBuscar ? normalizar(inputBuscar.value) : "";
  const visibles = clientes.filter(c => normalizar(c.nombre).includes(consulta));
  
  visibles.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));

  const cuerpo = $("filas");
  if (!cuerpo) return;
  cuerpo.textContent = "";

  if (visibles.length === 0) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 9;
    td.className = "vacio";
    td.textContent = clientes.length === 0
      ? "Aún no hay clientes registrados."
      : "Sin coincidencias para “" + (inputBuscar ? inputBuscar.value.trim() : "") + "”.";
    tr.appendChild(td);
    cuerpo.appendChild(tr);
  } else {
    const semanas = {};
    visibles.forEach(c => {
      const fechaBase = c.fecha || obtenerFechaHoyISO();
      const { key, etiqueta } = obtenerRangoSemana(fechaBase);
      if (!semanas[key]) {
        semanas[key] = { etiqueta, clientes: [], total: 0 };
      }
      semanas[key].clientes.push(c);
      semanas[key].total += Number(c.precio || 0);
    });

    Object.keys(semanas).sort().reverse().forEach(key => {
      const grupo = semanas[key];

      const trSemana = document.createElement("tr");
      trSemana.className = "semana-header";
      
      const tdEtiqueta = document.createElement("td");
      tdEtiqueta.colSpan = 7;
      tdEtiqueta.textContent = grupo.etiqueta;
      trSemana.appendChild(tdEtiqueta);

      const tdTotal = document.createElement("td");
      tdTotal.className = "num";
      tdTotal.textContent = "Subtotal: " + pesos(grupo.total);
      trSemana.appendChild(tdTotal);

      trSemana.appendChild(document.createElement("td"));
      cuerpo.appendChild(trSemana);

      grupo.clientes.forEach(c => {
        const tr = document.createElement("tr");
        celda(tr, formatearFechaVista(c.fecha));
        celda(tr, c.nombre);
        
        // Celda Teléfono
        const tdTel = document.createElement("td");
        const contTel = document.createElement("div");
        contTel.className = "editable-cell";
        
        const spanTel = document.createElement("span");
        spanTel.textContent = c.telefono || "Sin teléfono";
        if (!c.telefono || c.telefono === "Sin teléfono") spanTel.className = "sin-tel";
        contTel.appendChild(spanTel);

        if (c.telefono && c.telefono !== "Sin teléfono") {
          const numLimpio = c.telefono.replace(/\D/g, "");
          if (numLimpio.length >= 8) {
            const btnWsp = document.createElement("a");
            btnWsp.className = "btn-wsp";
            btnWsp.href = `https://wa.me/${numLimpio}`;
            btnWsp.target = "_blank";
            btnWsp.title = "Abrir WhatsApp";
            btnWsp.textContent = "WSP";
            contTel.appendChild(btnWsp);
          }
        }
        
        const btnEditTel = document.createElement("button");
        btnEditTel.className = "btn-edit";
        btnEditTel.type = "button";
        btnEditTel.title = "Editar teléfono";
        btnEditTel.textContent = "Editar";
        btnEditTel.onclick = () => editarTelefono(c.id);
        
        contTel.appendChild(btnEditTel);
        tdTel.appendChild(contTel);
        tr.appendChild(tdTel);

        // Celda Trabajo
        const tdTrabajo = document.createElement("td");
        const contTrabajo = document.createElement("div");
        contTrabajo.className = "editable-cell";
        const spanTrabajo = document.createElement("span");
        spanTrabajo.textContent = c.trabajo;
        
        const btnEditTrabajo = document.createElement("button");
        btnEditTrabajo.className = "btn-edit";
        btnEditTrabajo.type = "button";
        btnEditTrabajo.title = "Editar trabajo";
        btnEditTrabajo.textContent = "Editar";
        btnEditTrabajo.onclick = () => editarTrabajo(c.id);
        
        contTrabajo.appendChild(spanTrabajo);
        contTrabajo.appendChild(btnEditTrabajo);
        tdTrabajo.appendChild(contTrabajo);
        tr.appendChild(tdTrabajo);

        // Celda Método de Pago
        const tdPago = document.createElement("td");
        const contPago = document.createElement("div");
        contPago.className = "editable-cell";
        const spanPago = document.createElement("span");
        spanPago.textContent = c.pago || "Efectivo";
        
        const btnEditPago = document.createElement("button");
        btnEditPago.className = "btn-edit";
        btnEditPago.type = "button";
        btnEditPago.title = "Editar pago";
        btnEditPago.textContent = "Editar";
        btnEditPago.onclick = () => editarPago(c.id);
        
        contPago.appendChild(spanPago);
        contPago.appendChild(btnEditPago);
        tdPago.appendChild(contPago);
        tr.appendChild(tdPago);

        // Celda Factura
        const tdFactura = document.createElement("td");
        const contFactura = document.createElement("div");
        contFactura.className = "editable-cell";
        const spanFactura = document.createElement("span");
        spanFactura.textContent = c.factura || "Sin Factura";
        
        const btnEditFactura = document.createElement("button");
        btnEditFactura.className = "btn-edit";
        btnEditFactura.type = "button";
        btnEditFactura.title = "Editar factura";
        btnEditFactura.textContent = "Editar";
        btnEditFactura.onclick = () => editarFactura(c.id);
        
        contFactura.appendChild(spanFactura);
        contFactura.appendChild(btnEditFactura);
        tdFactura.appendChild(contFactura);
        tr.appendChild(tdFactura);

        // Celda IVA
        const tdIva = document.createElement("td");
        const contIva = document.createElement("div");
        contIva.className = "editable-cell";
        const spanIva = document.createElement("span");
        spanIva.textContent = c.aplicaIva ? "+IVA (19%)" : "Sin IVA";
        
        const btnEditIva = document.createElement("button");
        btnEditIva.className = "btn-edit";
        btnEditIva.type = "button";
        btnEditIva.title = "Editar IVA";
        btnEditIva.textContent = "Editar";
        btnEditIva.onclick = () => editarIva(c.id);
        
        contIva.appendChild(spanIva);
        contIva.appendChild(btnEditIva);
        tdIva.appendChild(contIva);
        tr.appendChild(tdIva);
        
        // Celda Precio Total
        const tdPrecio = document.createElement("td");
        tdPrecio.className = "num";
        const contPrecio = document.createElement("div");
        contPrecio.className = "editable-cell";
        contPrecio.style.justifyContent = "flex-end";
        
        const spanPrecio = document.createElement("span");
        if (!c.precio || c.precio === 0) {
          spanPrecio.textContent = "Presupuesto en espera";
          spanPrecio.className = "espera";
        } else {
          spanPrecio.textContent = pesos(c.precio);
        }
        
        const btnEditPrecio = document.createElement("button");
        btnEditPrecio.className = "btn-edit";
        btnEditPrecio.type = "button";
        btnEditPrecio.title = "Editar precio base";
        btnEditPrecio.textContent = "Editar";
        btnEditPrecio.onclick = () => editarPrecio(c.id);
        
        contPrecio.appendChild(spanPrecio);
        contPrecio.appendChild(btnEditPrecio);
        tdPrecio.appendChild(contPrecio);
        tr.appendChild(tdPrecio);
        
        // Celda Eliminar
        const tdAcciones = document.createElement("td");
        tdAcciones.className = "num";
        const b = document.createElement("button");
        b.type = "button";
        b.className = "danger" + (confirmando === c.id ? " confirm" : "");
        b.textContent = confirmando === c.id ? "¿Confirmar?" : "Eliminar";
        b.onclick = () => eliminar(c.id);
        tdAcciones.appendChild(b);
        tr.appendChild(tdAcciones);
        
        cuerpo.appendChild(tr);
      });
    });
  }

  const total = visibles.reduce((suma, c) => suma + Number(c.precio || 0), 0);
  const resumen = $("resumen");
  if (resumen) {
    resumen.textContent = (consulta ? visibles.length + " de " + clientes.length : clientes.length)
      + (clientes.length === 1 ? " cliente" : " clientes") + " · Total acumulado: " + pesos(total);
  }
}

function registrarCliente() {
  const elNombre = $("nombre");
  const elTelefono = $("telefono");
  const elTrabajo = $("trabajo");
  const elPago = $("pago");
  const elFactura = $("factura");
  const elIva = $("iva");
  const elPrecio = $("precio");

  const nombre = elNombre ? elNombre.value.trim() : "";
  const telefonoIngresado = elTelefono ? elTelefono.value.trim() : "";
  const telefono = telefonoIngresado || "Sin teléfono";
  const trabajo = elTrabajo ? elTrabajo.value.trim() : "";
  const pago = elPago ? elPago.value : "Efectivo";
  const factura = elFactura ? elFactura.value : "Sin Factura";
  const aplicaIva = elIva ? elIva.value === "con" : false;
  const precioBase = elPrecio ? Number(elPrecio.value) : 0;
  const fecha = obtenerFechaHoyISO();

  if (!nombre) return mensaje("Nombre: no puede estar vacío.", "error");
  if (!trabajo) return mensaje("Tipo de trabajo: no puede estar vacío.", "error");
  if (isNaN(precioBase) || precioBase < 0) return mensaje("Precio: ingresa un monto válido (0 o mayor).", "error");

  const precioFinal = (precioBase === 0) ? 0 : (aplicaIva ? Math.round(precioBase * 1.19) : precioBase);

  const nuevoCliente = { 
    id: Date.now() + Math.random(), 
    fecha, 
    nombre, 
    telefono, 
    trabajo, 
    pago,
    factura,
    aplicaIva,
    precioBase,
    precio: precioFinal 
  };

  clientes.unshift(nuevoCliente);
  guardar();

  if (elNombre) elNombre.value = "";
  if (elTelefono) elTelefono.value = "";
  if (elTrabajo) elTrabajo.value = "";
  if (elPago) elPago.value = "Efectivo";
  if (elFactura) elFactura.value = "Sin Factura";
  if (elIva) elIva.value = "sin";
  if (elPrecio) elPrecio.value = "";

  dibujar();
  if (elNombre) elNombre.focus();
  mensaje(nombre + (precioBase === 0 ? " registrado en espera de presupuesto." : " registrado correctamente."), "ok");
}

function eliminar(id) {
  if (confirmando !== id) {
    confirmando = id;
    dibujar();
    setTimeout(() => { if (confirmando === id) { confirmando = null; dibujar(); } }, 4000);
    return;
  }
  const cliente = clientes.find(c => c.id === id);
  clientes = clientes.filter(c => c.id !== id);
  confirmando = null;
  guardar();
  dibujar();
  mensaje((cliente ? cliente.nombre : "Cliente") + " eliminado.", "ok");
}

function descargarArchivo(contenido, nombreArchivo, tipoMime) {
  const blob = new Blob([contenido], { type: tipoMime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportarExcel() {
  if (clientes.length === 0) return mensaje("No hay clientes registrados.", "error");
  let csv = "\uFEFFFecha;Nombre;Teléfono;Tipo de Trabajo;Método de Pago;Factura;IVA;Precio Base;Precio Total ($)\n";
  clientes.forEach(c => {
    const f = formatearFechaVista(c.fecha);
    const n = `"${(c.nombre || "").replace(/"/g, '""')}"`;
    const t = `"${(c.telefono || "").replace(/"/g, '""')}"`;
    const tr = `"${(c.trabajo || "").replace(/"/g, '""')}"`;
    const pg = `"${(c.pago || "Efectivo").replace(/"/g, '""')}"`;
    const fc = `"${(c.factura || "Sin Factura").replace(/"/g, '""')}"`;
    const iv = c.aplicaIva ? "Con IVA (19%)" : "Sin IVA";
    const pb = c.precioBase !== undefined ? c.precioBase : (c.precio || 0);
    const pt = (c.precio === 0 || !c.precio) ? "Presupuesto en espera" : c.precio;
    csv += `${f};${n};${t};${tr};${pg};${fc};${iv};${pb};${pt}\n`;
  });
  descargarArchivo(csv, `centro_hidraulico_${obtenerFechaHoyISO()}.csv`, "text/csv;charset=utf-8;");
  mensaje("Datos exportados a Excel (CSV).", "ok");
}

function exportarJSON() {
  if (clientes.length === 0) return mensaje("No hay registros para respaldar.", "error");
  const contenido = JSON.stringify(clientes, null, 2);
  descargarArchivo(contenido, `respaldo_centro_hidraulico_${obtenerFechaHoyISO()}.json`, "application/json");
  mensaje("Copia de respaldo descargada.", "ok");
}

function importarJSON(evento) {
  const archivo = evento.target.files[0];
  if (!archivo) return;
  const lector = new FileReader();
  lector.onload = function(e) {
    try {
      const datos = JSON.parse(e.target.result);
      if (Array.isArray(datos)) {
        if (confirm(`¿Cargar ${datos.length} clientes en la lista?`)) {
          clientes = datos;
          guardar();
          dibujar();
          mensaje(`Cargados ${datos.length} clientes.`, "ok");
        }
      } else {
        mensaje("Archivo no válido.", "error");
      }
    } catch (err) {
      mensaje("Error al leer el archivo.", "error");
    }
    evento.target.value = "";
  };
  lector.readAsText(archivo);
}

// Inicialización
cargar();
dibujar();
